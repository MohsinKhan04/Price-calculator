const CLOUD_KEYS = ["catalog", "routes", "transporters", "settings", "template", "cycles", "quotes", "quoteSeq", "users", "authSettings", "brand_settings", "workspaceState", "quoteLogs", "mlMappings"];

async function myId() {
  return S.currentUser?.id || S.currentUser?.email || "u-admin";
}

function applyDocToMemoryAndLocal(path, data) {
  markLocalMutation();
  if (path === "master/catalog") { S.catalog = data; saveLocal("catalog", data); }
  else if (path === "master/routes") { S.routes = data; saveLocal("routes", data); }
  else if (path === "master/transporters") { S.transporters = data; saveLocal("transporters", data); }
  else if (path === "master/settings") { S.settings = data; saveLocal("settings", data); }
  else if (path === "master/template") { S.template = data; saveLocal("template", data); }
  else if (path.startsWith("cycles/")) {
    const id = path.split("/")[1];
    const doc = { ...data, id, effectiveDate: data.effectiveDate || id };
    const idx = S.cycles.findIndex(c => c.id === id);
    if (idx >= 0) S.cycles[idx] = doc;
    else S.cycles.push(doc);
    saveLocal("cycles", S.cycles);
  } else if (path.startsWith("quotes/")) {
    const id = path.split("/")[1];
    const doc = { ...data, id };
    const idx = S.quotes.findIndex(q => q.id === id);
    if (idx >= 0) S.quotes[idx] = doc;
    else S.quotes.unshift(doc);
    saveLocal("quotes", S.quotes);
  }
  updateSidebarStats();
}

async function writeDoc(path, data) {
  applyDocToMemoryAndLocal(path, data);
  if (path === "master/catalog") return await pushKeyToNeon("catalog", S.catalog);
  if (path === "master/routes") return await pushKeyToNeon("routes", S.routes);
  if (path === "master/transporters") return await pushKeyToNeon("transporters", S.transporters);
  if (path === "master/settings") return await pushKeyToNeon("settings", S.settings);
  if (path === "master/template") return await pushKeyToNeon("template", S.template);
  if (path.startsWith("cycles/")) return await pushKeyToNeon("cycles", S.cycles);
  return true;
}

function saveDoc(path, data, delay = 400) {
  applyDocToMemoryAndLocal(path, data);
  if (pending[path]?.t) clearTimeout(pending[path].t);
  if (delay <= 0) {
    delete pending[path];
    writeDoc(path, data);
    return;
  }
  pending[path] = {
    data,
    t: setTimeout(() => {
      delete pending[path];
      writeDoc(path, data);
    }, delay)
  };
}

async function delDoc(path) {
  markLocalMutation();
  if (path.startsWith("cycles/")) {
    const id = path.split("/")[1];
    S.cycles = S.cycles.filter(c => c.id !== id);
    saveLocal("cycles", S.cycles);
    await pushKeyToNeon("cycles", S.cycles);
    render();
  } else if (path.startsWith("quotes/")) {
    const id = path.split("/")[1];
    S.quotes = S.quotes.filter(q => q.id !== id);
    saveLocal("quotes", S.quotes);
    try { await apiRequest("/api/quotes/" + encodeURIComponent(id), { method: "DELETE" }); } catch (e) {}
    render();
  }
}

function createHybridDbAdapter() {
  return {
    doc(path) {
      return {
        async set(data) { return await writeDoc(path, data); },
        async delete() { return await delDoc(path); }
      };
    },
    collection(name) {
      return {
        async add(data) {
          const id = "q_" + uid();
          const doc = { ...data, id };
          if (name === "quotes") {
            S.quotes = S.quotes || [];
            S.quotes.unshift(doc);
            saveLocal("quotes", S.quotes);
            try {
              await apiRequest("/api/quotes", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ quote: doc })
              });
            } catch (e) {}
            updateSidebarStats();
          }
          return { id };
        }
      };
    }
  };
}
